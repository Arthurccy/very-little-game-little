openapi: 3.1.0
info:
  title: Pan ! Mauvaise réponse
  version: 0.1.0
  summary: Contrat HTTP de l'API du FPS éducatif.
  description: |
    Le serveur est l'arbitre. Le client affiche l'état renvoyé ici et n'invente ni score,
    ni PV, ni bonne réponse.

    Invariants :

    - `isCorrect` n'apparaît que dans les ressources d'administration (`AdminQuestion`).
      Tant qu'une question de partie est ouverte, les cibles sont `{ id, text }`.
    - La bonne réponse, l'explication et le lien MDN ne sortent qu'une fois la question
      close (`reveal`), que la clôture vienne d'un tir, d'un timeout ou d'un chrono déjà échu.
    - Toutes les réponses de partie portent `serverNow`. Le client cale son chrono dessus.
    - Les identifiants sont des chaînes opaques (cuid), 1 à 64 caractères.
    - JSON partout, UTF-8. Corps limité à 32 Ko (au-delà : 413).
    - Les propriétés inconnues d'un corps sont ignorées.
    - CORS : origine exacte du client, `credentials: true`, `Vary: Origin`.

    Authentification : jeton d'accès JWT (HS256, 15 min par défaut) dans
    `Authorization: Bearer`. Refresh opaque dans le cookie `httpOnly` `refresh_token`
    (`SameSite=Lax`, `Path=/auth`, 7 jours par défaut, `Secure` en production).
    Le refresh n'est jamais renvoyé dans le JSON.

    Règles de partie (rappel, le détail est dans `docs/conception.md`) :

    - 100 PV. Tirer sur la bonne réponse : −25 PV, question ratée. Chrono échu : −20 PV, question ratée.
    - 6 zones de 4 questions standard, puis une zone boss de 6 questions. 30 questions.
    - Une seule partie `IN_PROGRESS` par joueur : en créer une nouvelle abandonne la précédente.
    - 3 pauses de 30 s maximum. Pendant la pause, tirs et timeout répondent 409.
    - La première question démarre 3 s après la création. Entre deux questions, 6 s de lecture :
      `startedAt` peut être dans le futur, un tir avant est un 409.
    - Mode `TRAINING` : même arbitrage, aucune perte de PV, hors classement.
    - Bonus éventuel sur un tir qui élimine une mauvaise réponse : `SLOW_TIME` (+5 s),
      `REMOVE_WRONG` (une mauvaise restante, s'il en reste au moins deux), `HEAL` (+15 PV, plafonné à 100, mode normal).

    Erreurs : un seul format, `{ "error": { "code", "message", "details"? } }`.

    | Statut | Code | Cas |
    | --- | --- | --- |
    | 400 | `VALIDATION` | corps, query ou paramètre refusé |
    | 401 | `UNAUTHENTICATED` | jeton ou refresh absent, invalide ou expiré |
    | 403 | `FORBIDDEN` | rôle insuffisant, partie d'un autre joueur, origine refusée |
    | 404 | `NOT_FOUND` | ressource ou route inconnue |
    | 409 | `CONFLICT` | doublon, partie close ou en pause, chrono ou question pas prêts |
    | 413 | `VALIDATION` | corps trop volumineux |
    | 429 | `RATE_LIMITED` | trop d'inscriptions ou de connexions |
    | 500 | `INTERNAL` | message générique |

servers:
  - url: http://localhost:43124
    description: API locale

tags:
  - name: Santé
    description: Disponibilité du processus.
  - name: Authentification
    description: Compte joueur, jeton d'accès et cookie de refresh.
  - name: Partie
    description: Création, reprise, tirs, timeout, pause et abandon. Réservé au propriétaire.
  - name: Public
    description: Thèmes et classement, sans authentification.
  - name: Administration
    description: Questions et statistiques. Rôle `ADMIN`.

paths:
  /health:
    get:
      tags: [Santé]
      operationId: getHealth
      summary: Vérifier que l'API répond
      security: []
      responses:
        '200':
          description: Processus joignable.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Créer un compte joueur
      description: |
        Crée un utilisateur de rôle `PLAYER` et ouvre une session.
        Limité à 50 requêtes par 15 minutes et par adresse IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/AuthCreated'
        '400':
          $ref: '#/components/responses/Validation'
        '409':
          description: Email ou pseudo déjà utilisé.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                email:
                  value:
                    error: { code: CONFLICT, message: Email déjà utilisé }
                pseudo:
                  value:
                    error: { code: CONFLICT, message: Pseudo déjà pris }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Ouvrir une session
      description: |
        Même durée de traitement si l'email est inconnu : la réponse ne révèle pas
        l'existence du compte. Limité à 50 requêtes par 15 minutes et par adresse IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthOk'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          description: Email ou mot de passe incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: { code: UNAUTHENTICATED, message: Email ou mot de passe incorrect }
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/refresh:
    post:
      tags: [Authentification]
      operationId: refresh
      summary: Renouveler le jeton d'accès
      description: |
        Lit le cookie `refresh_token`, le fait tourner (l'ancien est révoqué) et renvoie
        un nouvel access token plus un nouveau cookie. Réutiliser un refresh déjà remplacé
        révoque toute la chaîne. Si l'`Origin` est présente, elle doit être celle du client.
        Un refresh invalide efface le cookie.
      security:
        - refreshCookie: []
      responses:
        '200':
          $ref: '#/components/responses/AuthOk'
        '401':
          description: Cookie absent, inconnu, expiré ou révoqué.
          headers:
            Set-Cookie:
              description: Efface `refresh_token` (`Max-Age=0`, `Path=/auth`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: { code: UNAUTHENTICATED, message: Session expirée }
        '403':
          $ref: '#/components/responses/UntrustedOrigin'
        '500':
          $ref: '#/components/responses/Internal'

  /auth/logout:
    post:
      tags: [Authentification]
      operationId: logout
      summary: Révoquer le refresh et effacer le cookie
      description: |
        Révoque le refresh présenté par le cookie, puis l'efface. Sans cookie valide,
        le cookie est tout de même effacé et la réponse reste 204.
        Si l'`Origin` est présente, elle doit être celle du client.
      security:
        - refreshCookie: []
      responses:
        '204':
          description: Session de refresh close. Corps vide.
          headers:
            Set-Cookie:
              description: Efface `refresh_token` (`Path=/auth`).
              schema:
                type: string
        '403':
          $ref: '#/components/responses/UntrustedOrigin'
        '500':
          $ref: '#/components/responses/Internal'

  /themes:
    get:
      tags: [Public]
      operationId: listThemes
      summary: Lister les thèmes
      description: Triés par `order` croissant. Six thèmes dans le seed.
      security: []
      responses:
        '200':
          description: Thèmes disponibles.
          headers:
            Cache-Control:
              description: '`public, max-age=300`'
              schema:
                type: string
                examples: ['public, max-age=300']
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theme'
        '500':
          $ref: '#/components/responses/Internal'

  /leaderboard:
    get:
      tags: [Public]
      operationId: getLeaderboard
      summary: Classement des meilleures parties normales
      description: |
        Une entrée par joueur : sa meilleure partie `NORMAL` terminée `WON` ou `LOST`.
        Les abandons et le mode entraînement sont exclus. Tri : score décroissant,
        puis fin de partie la plus ancienne.
      security: []
      parameters:
        - $ref: '#/components/parameters/LeaderboardLimit'
      responses:
        '200':
          description: Classement.
          headers:
            Cache-Control:
              description: '`no-cache`'
              schema:
                type: string
                examples: [no-cache]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LeaderboardEntry'
        '400':
          $ref: '#/components/responses/Validation'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions:
    post:
      tags: [Partie]
      operationId: createSession
      summary: Créer une partie
      description: |
        Tire et persiste la série (4 questions standard par thème, puis 6 boss),
        mélange les réponses, active la première question et abandonne toute partie
        encore `IN_PROGRESS` du même joueur. `mode` absent vaut `NORMAL`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Partie créée, première question armée (`startedAt` dans 3 s).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: Pool de questions insuffisant pour tirer une partie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}:
    get:
      tags: [Partie]
      operationId: getSession
      summary: Reprendre une partie
      description: |
        État courant et question active. `question` est `null` si aucune question
        n'est `ACTIVE` (partie terminée).
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: État de la partie.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}/summary:
    get:
      tags: [Partie]
      operationId: getSessionSummary
      summary: Bilan d'une partie
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Questions réussies, ratées et meilleur combo.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionSummary'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}/shots:
    post:
      tags: [Partie]
      operationId: shoot
      summary: Tirer sur une réponse
      description: |
        `answerId` doit appartenir à la question active et ne pas être déjà éliminée.
        Si l'horloge serveur a dépassé `deadlineAt`, le tir est traité comme un timeout
        (`outcome` = `TIMEOUT`) et la question est ratée.

        Issues :

        - `ELIMINATED_WRONG` : la cible tombe, la question continue. Un bonus peut tomber.
          Si c'était la dernière mauvaise réponse, la question est réussie et close.
        - `HIT_CORRECT` : −25 PV (0 en entraînement), question ratée, combo remis à 0.
        - `TIMEOUT` : −20 PV (0 en entraînement), question ratée, combo remis à 0.

        Question close et partie encore en cours : `nextQuestion` est la suivante,
        avec un `startedAt` 6 s plus tard. Dernière question close avec des PV :
        `session.status` = `WON`. PV à 0 : `LOST`. Les écritures d'un tir sont atomiques.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShotRequest'
      responses:
        '200':
          description: Tir arbitré.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResponse'
        '400':
          description: |
            Corps invalide, réponse hors de la question active, ou réponse déjà éliminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: |
            Partie terminée, partie en pause, ou question pas encore commencée
            (`serverNow` < `startedAt`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}/timeout:
    post:
      tags: [Partie]
      operationId: timeoutQuestion
      summary: Clore la question dont le chrono est échu
      description: |
        Refusé tant que `serverNow` < `deadlineAt`. Même effet qu'un tir arrivé après
        l'échéance : −20 PV (0 en entraînement), question `FAILED`, combo à 0.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Question close pour échéance. Même corps qu'un tir.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShotResponse'
              example:
                serverNow: '2026-10-27T10:00:20.000Z'
                outcome: TIMEOUT
                elapsedMs: 20000
                questionClosed: true
                reveal:
                  correctAnswerId: clanswer
                  explanation: 401 signifie non authentifié, 403 signifie interdit.
                  mdnUrl: https://developer.mozilla.org/fr/docs/Web/HTTP/Reference/Status/401
                  pointsAwarded: 0
                bonus: null
                question: null
                nextQuestion: null
                session:
                  id: clsession
                  mode: NORMAL
                  status: IN_PROGRESS
                  score: 120
                  hp: 80
                  combo: 0
                  multiplier: 1
                  currentIndex: 1
                  total: 30
                  paused: false
                  pauseEndsAt: null
                  pausesLeft: 3
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Chrono pas encore échu, partie en pause, ou partie déjà terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                early:
                  value:
                    error: { code: CONFLICT, message: Le chrono n’est pas écoulé }
                paused:
                  value:
                    error: { code: CONFLICT, message: La partie est en pause }
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}/pause:
    post:
      tags: [Partie]
      operationId: pauseSession
      summary: Mettre la partie en pause
      description: |
        Au plus 3 pauses. Le serveur gèle le chrono. La pause expire toute seule au bout
        de 30 s, à la prochaine requête. Le client masque la question pendant ce temps.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Partie en pause. `session.paused` est vrai et `pauseEndsAt` est posé.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: Déjà en pause, plus de pause disponible, ou partie terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}/resume:
    post:
      tags: [Partie]
      operationId: resumeSession
      summary: Reprendre la partie
      description: |
        Décale `startedAt` et `deadlineAt` de la question en cours (ou sur le point de
        démarrer) de la durée réelle de la pause, plafonnée à 30 s. Le temps restant
        et le bonus de vitesse sont préservés.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Partie reprise, horaires décalés.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetail'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: La partie n'est pas en pause, ou elle est déjà terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          $ref: '#/components/responses/Internal'

  /sessions/{id}/end:
    post:
      tags: [Partie]
      operationId: endSession
      summary: Abandonner la partie
      description: |
        Passe la partie en `ABANDONED`. Le score est conservé mais la partie ne compte
        pas au classement.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Partie abandonnée.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForeignSession'
        '404':
          $ref: '#/components/responses/SessionNotFound'
        '409':
          description: La partie est déjà terminée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error: { code: CONFLICT, message: La partie est terminée }
        '500':
          $ref: '#/components/responses/Internal'

  /admin/questions:
    get:
      tags: [Administration]
      operationId: listAdminQuestions
      summary: Lister les questions
      description: Inclut les questions inactives par défaut.
      parameters:
        - name: themeId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/QuestionKind'
        - name: includeInactive
          in: query
          required: false
          description: Chaîne `true` ou `false`. Défaut `true`.
          schema:
            type: string
            enum: ['true', 'false']
            default: 'true'
      responses:
        '200':
          description: Questions correspondant au filtre.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminQuestion'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '500':
          $ref: '#/components/responses/Internal'
    post:
      tags: [Administration]
      operationId: createAdminQuestion
      summary: Créer une question
      description: |
        Exactement une bonne réponse, 3 à 6 réponses, textes uniques sans tenir compte
        de la casse. `isActive` absent vaut vrai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQuestionInput'
      responses:
        '201':
          description: Question créée.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400':
          description: Corps invalide, thème inconnu, ou règle de réponses non respectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/Internal'

  /admin/questions/{id}:
    parameters:
      - $ref: '#/components/parameters/QuestionId'
    get:
      tags: [Administration]
      operationId: getAdminQuestion
      summary: Lire une question
      responses:
        '200':
          description: Question, y compris `isCorrect` sur chaque réponse.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '500':
          $ref: '#/components/responses/Internal'
    put:
      tags: [Administration]
      operationId: updateAdminQuestion
      summary: Remplacer une question
      description: |
        Remplace l'énoncé et le jeu de réponses. Une réponse du corps qui porte un `id`
        doit déjà appartenir à cette question. Les réponses omises sont retirées.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminQuestionInput'
      responses:
        '200':
          description: Question mise à jour.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminQuestion'
        '400':
          description: Corps invalide, thème inconnu, ou identifiant de réponse étranger.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/Internal'
    delete:
      tags: [Administration]
      operationId: deactivateAdminQuestion
      summary: Désactiver une question
      description: |
        Suppression douce : `isActive` passe à `false`. La question déjà jouée reste en base.
        Elle ne sera plus tirée dans les nouvelles parties.
      responses:
        '204':
          description: Question désactivée. Corps vide.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          $ref: '#/components/responses/Validation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '404':
          $ref: '#/components/responses/QuestionNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /stats/questions:
    get:
      tags: [Administration]
      operationId: getQuestionStats
      summary: Statistiques par question
      description: |
        Une ligne par question, y compris celles sans tentative. `successRate` et
        `averageElapsedMs` sont `null` sans tentative close. Le temps moyen est mesuré
        entre `startedAt` et `resolvedAt` côté serveur.
      responses:
        '200':
          description: Statistiques.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionStat'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenRole'
        '500':
          $ref: '#/components/responses/Internal'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT d'accès HS256. Claims utilisés : `sub` (id utilisateur) et `role`
        (`PLAYER` ou `ADMIN`). Durée par défaut : 15 minutes.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        Jeton opaque de 256 bits, cookie `httpOnly`, `SameSite=Lax`, `Path=/auth`.
        Stocké haché côté serveur. Durée par défaut : 7 jours.

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      description: Identifiant de la partie.
      schema:
        $ref: '#/components/schemas/Id'
    QuestionId:
      name: id
      in: path
      required: true
      description: Identifiant de la question (catalogue, pas la question de partie).
      schema:
        $ref: '#/components/schemas/Id'
    LeaderboardLimit:
      name: limit
      in: query
      required: false
      description: Nombre d'entrées, de 1 à 100. Défaut 20.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    CacheControlNoStore:
      description: '`no-store`'
      schema:
        type: string
        examples: [no-store]
    SetCookieRefresh:
      description: |
        Pose `refresh_token`. Attributs : `HttpOnly`, `SameSite=Lax`, `Path=/auth`,
        `Expires` aligné sur la durée du refresh, `Secure` en production.
      schema:
        type: string

  responses:
    AuthCreated:
      description: Compte créé et session ouverte.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Set-Cookie:
          $ref: '#/components/headers/SetCookieRefresh'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    AuthOk:
      description: Session ouverte ou renouvelée. Le cookie refresh est tourné.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
        Set-Cookie:
          $ref: '#/components/headers/SetCookieRefresh'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthResponse'
    Validation:
      description: Corps, query ou paramètre refusé. `details` liste les écarts.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: VALIDATION
              message: Requête invalide
              details:
                - path: email
                  message: Email invalide
    Unauthenticated:
      description: Jeton d'accès absent, mal formé ou expiré.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: UNAUTHENTICATED, message: Authentification requise }
    ForbiddenRole:
      description: Jeton valide, rôle différent de `ADMIN`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: FORBIDDEN, message: Rôle insuffisant }
    ForeignSession:
      description: La partie appartient à un autre joueur.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: FORBIDDEN, message: Cette partie appartient à un autre joueur }
    UntrustedOrigin:
      description: L'en-tête `Origin` est présent et différent de l'origine du client.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: FORBIDDEN, message: Origine non autorisée }
    SessionNotFound:
      description: Aucune partie avec cet identifiant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: NOT_FOUND, message: Partie introuvable }
    QuestionNotFound:
      description: Aucune question avec cet identifiant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: NOT_FOUND, message: Question introuvable }
    PayloadTooLarge:
      description: Corps supérieur à 32 Ko.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: VALIDATION, message: Corps de requête trop volumineux }
    RateLimited:
      description: Plus de 50 tentatives en 15 minutes pour cette adresse IP.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: RATE_LIMITED, message: 'Trop de tentatives, réessaie plus tard' }
    Internal:
      description: Erreur non prévue. Le message est générique.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error: { code: INTERNAL, message: Erreur interne }

  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 64
      description: Identifiant opaque (cuid).
      examples: [clxyz123]

    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - VALIDATION
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
            details:
              description: Présent sur les 400 de validation. Liste `{ path, message }`.
              type: array
              items:
                type: object
                additionalProperties: false
                required: [path, message]
                properties:
                  path:
                    type: string
                    examples: [answers]
                  message:
                    type: string
                    examples: [Exactement une bonne réponse]

    Role:
      type: string
      enum: [PLAYER, ADMIN]

    GameMode:
      type: string
      enum: [NORMAL, TRAINING]

    SessionStatus:
      type: string
      enum: [IN_PROGRESS, WON, LOST, ABANDONED]

    QuestionKind:
      type: string
      enum: [STANDARD, BOSS]

    ShotOutcome:
      type: string
      enum: [ELIMINATED_WRONG, HIT_CORRECT, TIMEOUT]

    BonusType:
      type: string
      enum: [SLOW_TIME, REMOVE_WRONG, HEAL]

    PublicUser:
      type: object
      additionalProperties: false
      required: [id, pseudo, role]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        pseudo:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [pseudo, email, password]
      properties:
        pseudo:
          type: string
          minLength: 3
          maxLength: 32
          pattern: '^[\p{L}\p{N}_-]+$'
          description: Lettres (tous alphabets), chiffres, `_` et `-`. Espaces retirés avant contrôle.
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128

    AuthResponse:
      type: object
      additionalProperties: false
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: JWT d'accès. À garder en mémoire côté client, jamais dans un stockage durable.
        user:
          $ref: '#/components/schemas/PublicUser'

    Theme:
      type: object
      additionalProperties: false
      required: [id, slug, name, scenery, order, intro]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          examples: [http]
        name:
          type: string
          examples: [HTTP]
        scenery:
          type: string
          description: Identifiant du décor 3D côté client.
        order:
          type: integer
          minimum: 1
          description: Ordre d'apparition des zones. Unique.
        intro:
          type: string

    PublicAnswer:
      type: object
      additionalProperties: false
      required: [id, text]
      description: Cible affichée. Pas de booléen de correction.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          type: string

    PublicQuestion:
      type: object
      additionalProperties: false
      description: |
        Question de partie (`id` est celui de la `SessionQuestion`, pas du catalogue).
        `startedAt` peut être dans le futur.
      required:
        - id
        - position
        - total
        - zone
        - kind
        - themeSlug
        - statement
        - answers
        - eliminatedAnswerIds
        - timeLimitMs
        - startedAt
        - deadlineAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        position:
          type: integer
          minimum: 0
          description: Index dans la série, à partir de 0.
        total:
          type: integer
          examples: [30]
        zone:
          type: integer
          minimum: 1
          maximum: 7
          description: 1 à 6 pour les thèmes, 7 pour le boss.
        kind:
          $ref: '#/components/schemas/QuestionKind'
        themeSlug:
          type: string
        statement:
          type: string
        answers:
          type: array
          minItems: 3
          maxItems: 6
          description: Ordre mélangé par le serveur et persisté pour cette partie.
          items:
            $ref: '#/components/schemas/PublicAnswer'
        eliminatedAnswerIds:
          type: array
          items:
            $ref: '#/components/schemas/Id'
        timeLimitMs:
          type: integer
          minimum: 1
          description: Durée impartie, éventuellement rallongée par `SLOW_TIME`.
        startedAt:
          type: string
          format: date-time
        deadlineAt:
          type: string
          format: date-time

    SessionState:
      type: object
      additionalProperties: false
      required:
        - id
        - mode
        - status
        - score
        - hp
        - combo
        - multiplier
        - currentIndex
        - total
        - paused
        - pauseEndsAt
        - pausesLeft
      properties:
        id:
          $ref: '#/components/schemas/Id'
        mode:
          $ref: '#/components/schemas/GameMode'
        status:
          $ref: '#/components/schemas/SessionStatus'
        score:
          type: integer
          minimum: 0
        hp:
          type: integer
          minimum: 0
          maximum: 100
        combo:
          type: integer
          minimum: 0
          description: Réussites d'affilée. Remis à 0 après un échec.
        multiplier:
          type: number
          minimum: 1
          maximum: 4
          description: min(4, 1 + combo × 0,25), calculé avant la réussite en cours.
        currentIndex:
          type: integer
          minimum: 0
        total:
          type: integer
          examples: [30]
        paused:
          type: boolean
        pauseEndsAt:
          type: [string, 'null']
          format: date-time
          description: Échéance de la pause en cours, sinon `null`.
        pausesLeft:
          type: integer
          minimum: 0
          maximum: 3

    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        mode:
          allOf:
            - $ref: '#/components/schemas/GameMode'
          description: Défaut `NORMAL` si le champ est absent.
          default: NORMAL

    CreateSessionResponse:
      type: object
      additionalProperties: false
      required: [serverNow, session, question]
      properties:
        serverNow:
          $ref: '#/components/schemas/ServerNow'
        session:
          $ref: '#/components/schemas/SessionState'
        question:
          $ref: '#/components/schemas/PublicQuestion'

    SessionDetail:
      type: object
      additionalProperties: false
      required: [serverNow, session, question]
      properties:
        serverNow:
          $ref: '#/components/schemas/ServerNow'
        session:
          $ref: '#/components/schemas/SessionState'
        question:
          oneOf:
            - $ref: '#/components/schemas/PublicQuestion'
            - type: 'null'
          description: Question active, ou `null` si la partie n'en a plus.

    QuestionReveal:
      type: object
      additionalProperties: false
      required: [correctAnswerId, explanation, mdnUrl, pointsAwarded]
      properties:
        correctAnswerId:
          $ref: '#/components/schemas/Id'
        explanation:
          type: string
        mdnUrl:
          type: [string, 'null']
          format: uri
        pointsAwarded:
          type: integer
          minimum: 0
          description: 0 si la question est ratée.

    BonusDrop:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/BonusType'
        removedAnswerId:
          $ref: '#/components/schemas/Id'
          description: Présent pour `REMOVE_WRONG`.
        amount:
          type: integer
          description: Millisecondes ajoutées (`SLOW_TIME`) ou PV rendus (`HEAL`).

    ShotRequest:
      type: object
      additionalProperties: false
      required: [answerId]
      properties:
        answerId:
          $ref: '#/components/schemas/Id'

    ServerNow:
      type: string
      format: date-time
      description: Horloge serveur au moment de la réponse. Le client cale son chrono dessus.

    ShotResponse:
      type: object
      additionalProperties: false
      required:
        - serverNow
        - outcome
        - elapsedMs
        - session
        - questionClosed
        - reveal
        - bonus
        - question
        - nextQuestion
      properties:
        serverNow:
          $ref: '#/components/schemas/ServerNow'
        outcome:
          $ref: '#/components/schemas/ShotOutcome'
        elapsedMs:
          type: integer
          minimum: 0
          description: Temps écoulé depuis `startedAt`, mesuré par le serveur.
        session:
          $ref: '#/components/schemas/SessionState'
        questionClosed:
          type: boolean
        reveal:
          oneOf:
            - $ref: '#/components/schemas/QuestionReveal'
            - type: 'null'
          description: Renseigné seulement si `questionClosed` est vrai.
        bonus:
          oneOf:
            - $ref: '#/components/schemas/BonusDrop'
            - type: 'null'
        question:
          oneOf:
            - $ref: '#/components/schemas/PublicQuestion'
            - type: 'null'
          description: Question encore ouverte, à jour (éliminations, échéance). `null` si elle est close.
        nextQuestion:
          oneOf:
            - $ref: '#/components/schemas/PublicQuestion'
            - type: 'null'
          description: Question suivante si la précédente est close et que la partie continue.

    EndSessionResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/SessionState'

    SessionSummary:
      type: object
      additionalProperties: false
      required: [session, cleared, failed, bestCombo, startedAt, endedAt]
      properties:
        session:
          $ref: '#/components/schemas/SessionState'
        cleared:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        bestCombo:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: [string, 'null']
          format: date-time

    LeaderboardEntry:
      type: object
      additionalProperties: false
      required: [rank, pseudo, score, endedAt]
      properties:
        rank:
          type: integer
          minimum: 1
        pseudo:
          type: string
        score:
          type: integer
          minimum: 0
        endedAt:
          type: string
          format: date-time

    QuestionStat:
      type: object
      additionalProperties: false
      required:
        - questionId
        - statement
        - themeSlug
        - kind
        - isActive
        - attempts
        - successRate
        - averageElapsedMs
      properties:
        questionId:
          $ref: '#/components/schemas/Id'
        statement:
          type: string
        themeSlug:
          type: string
        kind:
          $ref: '#/components/schemas/QuestionKind'
        isActive:
          type: boolean
        attempts:
          type: integer
          minimum: 0
        successRate:
          type: [number, 'null']
          minimum: 0
          maximum: 1
          description: Part des tentatives closes réussies. `null` sans tentative.
        averageElapsedMs:
          type: [number, 'null']
          minimum: 0
          description: '`null` sans tentative close.'

    AdminAnswerInput:
      type: object
      additionalProperties: false
      required: [text, isCorrect]
      properties:
        id:
          $ref: '#/components/schemas/Id'
          description: Présent pour conserver une réponse existante lors d'un remplacement.
        text:
          type: string
          minLength: 1
          maxLength: 300
        isCorrect:
          type: boolean

    AdminQuestionInput:
      type: object
      additionalProperties: false
      required:
        - themeId
        - statement
        - explanation
        - difficulty
        - kind
        - timeLimitMs
        - basePoints
        - answers
      properties:
        themeId:
          $ref: '#/components/schemas/Id'
        statement:
          type: string
          minLength: 5
          maxLength: 500
        explanation:
          type: string
          minLength: 5
          maxLength: 1000
        mdnUrl:
          type: [string, 'null']
          format: uri
          maxLength: 500
          default: null
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
        kind:
          $ref: '#/components/schemas/QuestionKind'
        timeLimitMs:
          type: integer
          minimum: 5000
          maximum: 120000
        basePoints:
          type: integer
          minimum: 10
          maximum: 1000
        isActive:
          type: boolean
        answers:
          type: array
          minItems: 3
          maxItems: 6
          description: Exactement une réponse `isCorrect`, textes distincts sans tenir compte de la casse.
          items:
            $ref: '#/components/schemas/AdminAnswerInput'

    AdminQuestion:
      type: object
      additionalProperties: false
      description: Seule ressource qui expose `isCorrect`. Réservée au rôle `ADMIN`.
      required:
        - id
        - themeId
        - themeSlug
        - statement
        - explanation
        - mdnUrl
        - difficulty
        - kind
        - timeLimitMs
        - basePoints
        - isActive
        - answers
      properties:
        id:
          $ref: '#/components/schemas/Id'
        themeId:
          $ref: '#/components/schemas/Id'
        themeSlug:
          type: string
        statement:
          type: string
        explanation:
          type: string
        mdnUrl:
          type: [string, 'null']
        difficulty:
          type: integer
          minimum: 1
          maximum: 3
        kind:
          $ref: '#/components/schemas/QuestionKind'
        timeLimitMs:
          type: integer
        basePoints:
          type: integer
        isActive:
          type: boolean
        answers:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/AdminAnswerInput'
              - type: object
                required: [id]
security:
  - bearerAuth: []
