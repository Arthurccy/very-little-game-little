openapi: 3.1.0
info:
  title: Pan ! Mauvaise réponse — API
  version: 1.0.0
  description: |
    Contrat de l'API du jeu. Le serveur est seul arbitre : aucune réponse publique
    ne porte `isCorrect` avant la clôture d'une question (sauf le back-office, réservé à ADMIN).

    Authentification : jeton d'accès JWT dans `Authorization: Bearer`, refresh token
    opaque en cookie `httpOnly` (`refresh_token`, `Path=/auth`), jamais dans le JSON.
servers:
  - url: http://localhost:43124
    description: API locale (développement)

tags:
  - name: auth
  - name: jeu
  - name: classement
  - name: admin

paths:
  /auth/register:
    post:
      tags: [auth]
      summary: Créer un compte joueur
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Compte créé ; le refresh token est posé en cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login:
    post:
      tags: [auth]
      summary: Se connecter
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Connecté ; le refresh token est posé en cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Renouveler la session à partir du cookie refresh (rotation)
      operationId: refresh
      responses:
        '200':
          description: Nouveau jeton d'accès ; le refresh token est remplacé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /auth/logout:
    post:
      tags: [auth]
      summary: Se déconnecter (révoque le refresh token)
      operationId: logout
      responses:
        '204': { description: Déconnecté. }
        '403': { $ref: '#/components/responses/Forbidden' }

  /themes:
    get:
      tags: [jeu]
      summary: Thèmes dans l'ordre du parcours
      operationId: listThemes
      responses:
        '200':
          description: Liste des thèmes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Theme' }

  /sessions:
    post:
      tags: [jeu]
      summary: Créer une partie (tire la série, active la première question)
      operationId: createSession
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSessionRequest' }
      responses:
        '201':
          description: Partie créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateSessionResponse' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}:
    get:
      tags: [jeu]
      summary: État de la partie et question en cours (reprise)
      operationId: getSession
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: État courant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/summary:
    get:
      tags: [jeu]
      summary: Bilan de la partie
      operationId: getSessionSummary
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Bilan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /sessions/{id}/shots:
    post:
      tags: [jeu]
      summary: Tirer sur une réponse
      operationId: shoot
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShotRequest' }
      responses:
        '200':
          description: Résultat du tir (arbitré par le serveur).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShotResponse' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}/timeout:
    post:
      tags: [jeu]
      summary: Clore la question si l'échéance serveur est passée
      operationId: reportTimeout
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Question close sur un timeout.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShotResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}/pause:
    post:
      tags: [jeu]
      summary: Mettre la partie en pause (3 pauses de 30 s max)
      operationId: pauseSession
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Partie en pause.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}/resume:
    post:
      tags: [jeu]
      summary: Reprendre la partie (horaires décalés de la durée de la pause)
      operationId: resumeSession
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Partie reprise.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /sessions/{id}/end:
    post:
      tags: [jeu]
      summary: Abandonner la partie
      operationId: endSession
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Partie abandonnée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EndSessionResponse' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /leaderboard:
    get:
      tags: [classement]
      summary: Meilleure partie normale terminée de chaque joueur
      operationId: getLeaderboard
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Classement.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeaderboardEntry' }
        '400': { $ref: '#/components/responses/Validation' }

  /admin/questions:
    get:
      tags: [admin]
      summary: Lister les questions (avec isCorrect)
      operationId: listAdminQuestions
      security: [{ bearer: [] }]
      parameters:
        - { name: themeId, in: query, required: false, schema: { type: string } }
        - { name: kind, in: query, required: false, schema: { $ref: '#/components/schemas/QuestionKind' } }
        - { name: includeInactive, in: query, required: false, schema: { type: string, enum: ['true', 'false'], default: 'true' } }
      responses:
        '200':
          description: Questions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminQuestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      summary: Créer une question
      operationId: createAdminQuestion
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminQuestionInput' }
      responses:
        '201':
          description: Question créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/questions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [admin]
      summary: Lire une question
      operationId: getAdminQuestion
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Question.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin]
      summary: Modifier une question (réponses gardées par id)
      operationId: updateAdminQuestion
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminQuestionInput' }
      responses:
        '200':
          description: Question modifiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminQuestion' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [admin]
      summary: Désactiver une question (suppression douce)
      operationId: deactivateAdminQuestion
      security: [{ bearer: [] }]
      responses:
        '204': { description: Question désactivée. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /stats/questions:
    get:
      tags: [admin]
      summary: Taux de réussite et temps moyen par question
      operationId: getQuestionStats
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Statistiques.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/QuestionStat' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }

  responses:
    Validation:
      description: Requête invalide (corps, paramètres ou JSON mal formé).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Unauthenticated:
      description: Jeton absent, invalide ou expiré ; identifiants incorrects.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Rôle insuffisant, partie d'un autre joueur ou origine refusée.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Ressource inconnue.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Conflit d'état (compte existant, partie close ou en pause, question pas commencée…).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    RateLimited:
      description: Trop de tentatives.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }

  schemas:
    Role: { type: string, enum: [PLAYER, ADMIN] }
    GameMode: { type: string, enum: [NORMAL, TRAINING] }
    SessionStatus: { type: string, enum: [IN_PROGRESS, WON, LOST, ABANDONED] }
    QuestionKind: { type: string, enum: [STANDARD, BOSS] }
    ShotOutcome: { type: string, enum: [ELIMINATED_WRONG, HIT_CORRECT, TIMEOUT] }
    BonusType: { type: string, enum: [SLOW_TIME, REMOVE_WRONG, HEAL] }

    PublicUser:
      type: object
      required: [id, pseudo, role]
      properties:
        id: { type: string }
        pseudo: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    RegisterRequest:
      type: object
      required: [pseudo, email, password]
      properties:
        pseudo: { type: string, minLength: 3, maxLength: 32 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }

    AuthResponse:
      type: object
      description: Le refresh token voyage uniquement en cookie httpOnly, jamais dans ce JSON.
      required: [accessToken, user]
      properties:
        accessToken: { type: string }
        user: { $ref: '#/components/schemas/PublicUser' }

    Theme:
      type: object
      required: [id, slug, name, scenery, order, intro]
      properties:
        id: { type: string }
        slug: { type: string }
        name: { type: string }
        scenery: { type: string, description: Identifiant du décor 3D de la zone. }
        order: { type: integer }
        intro: { type: string }

    PublicAnswer:
      type: object
      description: Une cible à l'écran, sans le booléen isCorrect.
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }

    PublicQuestion:
      type: object
      required: [id, position, total, zone, kind, themeSlug, statement, answers, eliminatedAnswerIds, timeLimitMs, startedAt, deadlineAt]
      properties:
        id: { type: string, description: Identifiant de la question dans la partie. }
        position: { type: integer }
        total: { type: integer }
        zone: { type: integer, description: 1 à 6 pour les thèmes, 7 pour le boss. }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        themeSlug: { type: string }
        statement: { type: string }
        answers:
          type: array
          items: { $ref: '#/components/schemas/PublicAnswer' }
        eliminatedAnswerIds:
          type: array
          items: { type: string }
        timeLimitMs: { type: integer }
        startedAt: { type: string, format: date-time, description: Peut être dans le futur (délai avant la question). }
        deadlineAt: { type: string, format: date-time }

    SessionState:
      type: object
      required: [id, mode, status, score, hp, combo, multiplier, currentIndex, total, paused, pauseEndsAt, pausesLeft]
      properties:
        id: { type: string }
        mode: { $ref: '#/components/schemas/GameMode' }
        status: { $ref: '#/components/schemas/SessionStatus' }
        score: { type: integer }
        hp: { type: integer }
        combo: { type: integer }
        multiplier: { type: number }
        currentIndex: { type: integer }
        total: { type: integer }
        paused: { type: boolean }
        pauseEndsAt: { type: [string, 'null'], format: date-time }
        pausesLeft: { type: integer }

    CreateSessionRequest:
      type: object
      required: [mode]
      properties:
        mode: { $ref: '#/components/schemas/GameMode' }

    CreateSessionResponse:
      type: object
      required: [session, question, serverNow]
      properties:
        session: { $ref: '#/components/schemas/SessionState' }
        question: { $ref: '#/components/schemas/PublicQuestion' }
        serverNow: { type: string, format: date-time }

    SessionDetailResponse:
      type: object
      required: [session, question, serverNow]
      properties:
        session: { $ref: '#/components/schemas/SessionState' }
        question:
          oneOf:
            - { $ref: '#/components/schemas/PublicQuestion' }
            - { type: 'null' }
        serverNow: { type: string, format: date-time }

    ShotRequest:
      type: object
      required: [answerId]
      properties:
        answerId: { type: string }

    QuestionReveal:
      type: object
      description: Révélé seulement une fois la question close.
      required: [correctAnswerId, explanation, mdnUrl, pointsAwarded]
      properties:
        correctAnswerId: { type: string }
        explanation: { type: string }
        mdnUrl: { type: [string, 'null'] }
        pointsAwarded: { type: integer }

    BonusDrop:
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/BonusType' }
        removedAnswerId: { type: string, description: REMOVE_WRONG — réponse retirée. }
        amount: { type: integer, description: SLOW_TIME — ms ajoutées ; HEAL — PV rendus. }

    ShotResponse:
      type: object
      required: [outcome, elapsedMs, session, questionClosed, reveal, bonus, question, nextQuestion, serverNow]
      properties:
        outcome: { $ref: '#/components/schemas/ShotOutcome' }
        elapsedMs: { type: integer }
        session: { $ref: '#/components/schemas/SessionState' }
        questionClosed: { type: boolean }
        reveal:
          oneOf:
            - { $ref: '#/components/schemas/QuestionReveal' }
            - { type: 'null' }
        bonus:
          oneOf:
            - { $ref: '#/components/schemas/BonusDrop' }
            - { type: 'null' }
        question:
          oneOf:
            - { $ref: '#/components/schemas/PublicQuestion' }
            - { type: 'null' }
        nextQuestion:
          oneOf:
            - { $ref: '#/components/schemas/PublicQuestion' }
            - { type: 'null' }
        serverNow: { type: string, format: date-time }

    EndSessionResponse:
      type: object
      required: [session]
      properties:
        session: { $ref: '#/components/schemas/SessionState' }

    SessionSummary:
      type: object
      required: [session, cleared, failed, bestCombo, startedAt, endedAt]
      properties:
        session: { $ref: '#/components/schemas/SessionState' }
        cleared: { type: integer }
        failed: { type: integer }
        bestCombo: { type: integer }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }

    LeaderboardEntry:
      type: object
      required: [rank, pseudo, score, endedAt]
      properties:
        rank: { type: integer }
        pseudo: { type: string }
        score: { type: integer }
        endedAt: { type: string, format: date-time }

    QuestionStat:
      type: object
      required: [questionId, statement, themeSlug, kind, isActive, attempts, successRate, averageElapsedMs]
      properties:
        questionId: { type: string }
        statement: { type: string }
        themeSlug: { type: string }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        isActive: { type: boolean }
        attempts: { type: integer }
        successRate: { type: [number, 'null'], description: Entre 0 et 1, null sans tentative. }
        averageElapsedMs: { type: [integer, 'null'] }

    AdminAnswerInput:
      type: object
      required: [text, isCorrect]
      properties:
        id: { type: string, description: Présent pour modifier une réponse existante. }
        text: { type: string, minLength: 1, maxLength: 300 }
        isCorrect: { type: boolean }

    AdminQuestionInput:
      type: object
      required: [themeId, statement, explanation, mdnUrl, difficulty, kind, timeLimitMs, basePoints, answers]
      properties:
        themeId: { type: string }
        statement: { type: string, minLength: 5, maxLength: 500 }
        explanation: { type: string, minLength: 5, maxLength: 1000 }
        mdnUrl: { type: [string, 'null'], format: uri }
        difficulty: { type: integer, minimum: 1, maximum: 3 }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        timeLimitMs: { type: integer, minimum: 5000, maximum: 120000 }
        basePoints: { type: integer, minimum: 10, maximum: 1000 }
        isActive: { type: boolean }
        answers:
          type: array
          minItems: 3
          maxItems: 6
          description: Exactement une bonne réponse, pas de doublon.
          items: { $ref: '#/components/schemas/AdminAnswerInput' }

    AdminAnswer:
      type: object
      required: [id, text, isCorrect]
      properties:
        id: { type: string }
        text: { type: string }
        isCorrect: { type: boolean }

    AdminQuestion:
      type: object
      description: Réservé au rôle ADMIN — seul endroit où isCorrect est exposé.
      required: [id, themeId, themeSlug, statement, explanation, mdnUrl, difficulty, kind, timeLimitMs, basePoints, isActive, answers]
      properties:
        id: { type: string }
        themeId: { type: string }
        themeSlug: { type: string }
        statement: { type: string }
        explanation: { type: string }
        mdnUrl: { type: [string, 'null'] }
        difficulty: { type: integer }
        kind: { $ref: '#/components/schemas/QuestionKind' }
        timeLimitMs: { type: integer }
        basePoints: { type: integer }
        isActive: { type: boolean }
        answers:
          type: array
          items: { $ref: '#/components/schemas/AdminAnswer' }

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [VALIDATION, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, CONFLICT, RATE_LIMITED, INTERNAL]
            message: { type: string }
            details: {}
